name: service_desk
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  win32: ^5.15.0
  flutter_platform_alert: ^0.8.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  signalr_netcore: ^0.1.7
  sidebarx: ^0.17.2
  provider: ^6.1.5+1
  syncfusion_flutter_datagrid: ^33.1.44
  syncfusion_flutter_core: ^33.2.4
  flutter_svg: ^2.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_localization: ^0.4.0
  responsive_framework: ^1.5.1
  hexcolor: ^3.1.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  lottie: ^3.3.2
  window_manager: ^0.5.1
  windows_notification: ^1.3.0
  fl_chart: ^1.2.0
  dropdown_button2: ^3.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/image/init_photo.svg
   - assets/image/wallpaper.png
   - assets/image/calendar.svg
   - assets/image/big_logo.png
   - assets/image/nav_icons/logo.svg
   - assets/image/nav_icons/company.svg
   - assets/image/nav_icons/company_select.svg
   - assets/image/nav_icons/deashboard.svg
   - assets/image/nav_icons/deashboard_select.svg
   - assets/image/nav_icons/sablon.svg
   - assets/image/nav_icons/sablon_select.svg
   - assets/image/nav_icons/setting.svg
   - assets/image/nav_icons/setting_select.svg
   - assets/image/nav_icons/tiket.svg
   - assets/image/nav_icons/tiket_select.svg
   - assets/image/nav_icons/new_tiket.svg
   - assets/image/nav_icons/new_tiket_select.svg
   - assets/image/icon_drop_dawn/drop_dawn.svg
   - assets/image/icon_drop_dawn/company_drop_dawn.svg
   - assets/image/tool_bar_ticket/column_setting.svg
   - assets/image/tool_bar_ticket/search.svg
   - assets/image/tool_bar_ticket/create_tiket.svg
   - assets/image/tool_bar_ticket/add_tiket.svg
   - assets/image/tool_bar_ticket/trash_act_tiket.svg
   - assets/image/tool_bar_ticket/get_tiket.svg
   - assets/image/tool_bar_ticket/edit_tiket.svg
   - assets/image/tool_bar_ticket/inbox.svg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true

  image_path: "assets/image/big_logo.png"
